  <a href="#home" class="nav-item active" aria-label="Home">
    <span class="nav-icon">⌂</span>
    <span class="nav-label">Home</span>
  </a>
  <a href="#about" class="nav-item" aria-label="About">
    <span class="nav-icon">◉</span>
    <span class="nav-label">About</span>
  </a>
  <a href="#education" class="nav-item" aria-label="Education">
    <span class="nav-icon">▤</span>
    <span class="nav-label">Education</span>
  </a>
  <a href="#projects" class="nav-item" aria-label="Projects">
    <span class="nav-icon">⌘</span>
    <span class="nav-label">Projects</span>
  </a>
  <a href="#contact" class="nav-item" aria-label="Contact">
    <span class="nav-icon">✉</span>
    <span class="nav-label">Contact</span>
  </a>
</nav>

<style>
.floating-nav {
  position: fixed;
  z-index: 9999;
  bottom: calc(24px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50px;
  background: rgba(20, 35, 65, .65);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 10px 40px rgba(0,0,0,.22);
  max-width: calc(100vw - 24px);
}

.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 46px;
  height: 46px;
  padding: 0 13px;
  border-radius: 40px;
  color: #c5d4ef;
  text-decoration: none;
  transition: all .3s ease;
}

.nav-icon { font-size: 20px; }
.nav-label {
  display: none;
  font-size: 13px;
  font-weight: 600;
}

.nav-item.active {
  background: rgba(85, 150, 255, .3);
  color: white;
}

.nav-item.active .nav-label {
  display: inline;
}

.nav-item:hover {
  background: rgba(255,255,255,.12);
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 30px;
}

body {
  padding-bottom: 110px;
}

section {
  scroll-margin-top: 30px;
}

@media (max-width: 480px) {
  .floating-nav {
    width: max-content;
    max-width: calc(100vw - 24px);
    gap: 2px;
  }

  .nav-item {
    width: 48px;
    min-width: 0;
    padding: 0;
  }

  .nav-item.active {
    width: 48px;
  }

  .nav-label { display: none !important; }
}
</style>

<script>
const navItems = document.querySelectorAll('.nav-item');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navItems.forEach(item => {
        item.classList.toggle(
          'active',
          item.getAttribute('href') === '#' + entry.target.id
        );
      });
    }
  });
}, { threshold: 0.35 });

navItems.forEach(item => {
  const section = document.querySelector(item.getAttribute('href'));
  if (section) observer.observe(section);
});
</script>
